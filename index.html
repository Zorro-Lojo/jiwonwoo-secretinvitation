<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서원우 ♥ 박지원 결혼합니다.</title>
<meta name="description" content="2027년 1월 17일">
<meta property="og:type" content="website">
<meta property="og:title" content="서원우 ♥ 박지원 결혼합니다.">
<meta property="og:description" content="2027년 1월 17일">
<meta property="og:url" content="https://jiwonwoo-marriage-notice.netlify.app/">
<meta property="og:image" content="https://jiwonwoo-marriage-notice.netlify.app/images/og-thumbnail.jpg">
<meta property="og:image:width" content="800">
<meta property="og:image:height" content="400">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 첫 터치 화면 (터치하면 음악 시작 + 사라짐) -->
<button class="intro" id="intro" type="button">
  <span class="intro-text" id="introText"></span>
</button>

<main class="card">
  <div class="glitch" id="glitch" aria-hidden="true"></div>

  <!-- 1. 커버 -->
  <section class="cover" id="sec-cover">
    <div class="cover-art reveal" id="coverArt"></div>
    <p class="names reveal" id="coverNames"></p>
    <p class="date reveal" id="coverDate"></p>
  </section>

  <!-- 2. 인사말 -->
  <section class="invitation" id="sec-invitation">
    <div class="reveal">
      <div class="eng-title" id="invEng"></div>
      <div class="ko-title" id="invKo"></div>
    </div>
    <div class="body reveal" id="invBody"></div>
  </section>

  <!-- 3. 혼주 -->
  <section class="family" id="sec-family">
    <div class="family-art reveal" id="familyArt"></div>
    <p class="family-text reveal" id="familyText"></p>
    <div class="reveal">
      <div id="familyRows"></div>
    </div>
  </section>

  <!-- 4. 남편 소개 (config.profiles[0]) -->
  <section class="profile" id="sec-groom" data-profile="0">
    <div class="reveal">
      <div class="eng-title"></div>
      <div class="ko-title"></div>
    </div>
    <div class="body reveal"></div>
    <div class="slider-wrap reveal">
      <div class="slider"></div>
      <button class="s-nav prev" type="button" aria-label="이전 사진">◀</button>
      <button class="s-nav next" type="button" aria-label="다음 사진">▶</button>
      <div class="slider-count"></div>
    </div>
  </section>

  <!-- 5. 아내 소개 (config.profiles[1]) -->
  <section class="profile" id="sec-bride" data-profile="1">
    <div class="reveal">
      <div class="eng-title"></div>
      <div class="ko-title"></div>
    </div>
    <div class="body reveal"></div>
    <div class="slider-wrap reveal">
      <div class="slider"></div>
      <button class="s-nav prev" type="button" aria-label="이전 사진">◀</button>
      <button class="s-nav next" type="button" aria-label="다음 사진">▶</button>
      <div class="slider-count"></div>
    </div>
  </section>

  <!-- 6. 공지 -->
  <section class="event" id="sec-event">
    <div class="reveal">
      <div class="eng-title" id="evEng"></div>
      <div class="ko-title" id="evKo"></div>
    </div>
    <div class="ev-list reveal" id="evList"></div>
    <div class="reveal">
      <div class="ev-map" id="evMap"></div>
      <p class="ev-note" id="evNote"></p>
    </div>
  </section>

  <!-- 7. 갤러리 -->
  <section class="gallery" id="sec-gallery">
    <div class="reveal">
      <div class="eng-title" id="galEng"></div>
      <div class="ko-title" id="galKo"></div>
    </div>
    <div class="gallery-grid reveal" id="galleryGrid"></div>
  </section>

  <!-- 8. 탈출 -->
  <section class="escape" id="sec-escape">
    <div class="reveal">
      <div class="eng-title" id="esEng"></div>
      <div class="ko-title" id="esKo"></div>
      <p class="lead" id="esLead"></p>
      <a class="btn" id="btnEscape"></a>
    </div>
    <div class="foot" id="foot"></div>
  </section>
</main>

<!-- 갤러리 확대 보기 -->
<div class="modal lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <div class="lb-track" id="lbTrack"></div>
  <div class="lb-count" id="lbCount" aria-live="polite"></div>
  <button class="lb-close" data-close type="button" aria-label="닫기">×</button>
</div>

<script src="js/config.js"></script>
<script src="js/bgm.js"></script>
<script src="js/glitch.js"></script>
<script src="js/main.js"></script></body>
</html>
